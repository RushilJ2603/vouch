# Server-defined policy overlays for the live judge surface. These adjust the
# effective business budget and when extra verification is purchased. They do
# not alter model scores, evidence counts, hard invariants or stored outcomes.

fast:
  label: Fast path
  description: Low-latency control for a mature, reversible workflow.
  budget_multiplier: 1.25
  tier2_mode: disabled
  tier2_timeout_sec: 0.0
  k: 1.0

adaptive:
  label: Adaptive control
  description: Deep verification only where a better estimate can change the decision.
  budget_multiplier: 1.0
  tier2_mode: close_calls
  tier2_timeout_sec: 2.0
  k: 2.0

deep:
  label: Deep verification
  description: GLM reviews every priced side effect above the review-cost floor.
  budget_multiplier: 0.65
  tier2_mode: side_effects
  tier2_timeout_sec: 15.0
  k: 2.0
