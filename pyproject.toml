[project]
name = "vouch"
version = "0.1.0"
description = "Earned autonomy for AI agents: score every response, price every action, expand authority only as far as a measured track record has earned."
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

# The rule set is pinned EXPLICITLY, alongside ruff's version in
# requirements.lock. Without a `select`, ruff 0.16 enables a very broad default
# set, so a routine ruff upgrade would turn the build red for rules nobody
# chose -- the same class of surprise the sklearn pin in requirements.lock
# exists to prevent, one layer up.
[tool.ruff.lint]
select = ["E", "F", "I"]        # pycodestyle errors, pyflakes, import sorting

# E501 (line-too-long) is DEFERRED, not disqualified: 16 real hits, 8 of them
# in store.py's DDL comments. Rewrapping them is a separate, reviewable change.
# Remove this ignore once that is done -- `line-length` above is already 100.
ignore = ["E501"]
